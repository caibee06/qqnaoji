<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QQ AI 助手 · 本地体验</title>
<style>body{margin:0;background:#f1f5f9;color:#17243b;font:16px/1.6 system-ui}main{max-width:780px;margin:40px auto;padding:24px}h1{margin-bottom:4px}small{color:#62748d}#messages{background:white;border-radius:20px;padding:24px;min-height:300px;margin:24px 0;box-shadow:0 8px 32px #243b5310}.message{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px 18px;border-radius:12px;background:#edf3fc;margin:10px 0}.user{background:#e5f6f0}textarea{box-sizing:border-box;width:100%;padding:16px;border:1px solid #ccd6e3;border-radius:12px;font:inherit;resize:vertical}button{background:#2865dc;color:white;border:0;border-radius:10px;padding:12px 20px;margin:10px 8px 0 0;cursor:pointer}button:disabled{opacity:.5}#status{font-size:14px;color:#62748d}</style></head>
<body><main><h1>QQ AI 助手</h1><small>先在这里体验对话，再连接 QQ。模拟模式用于验证流程。</small><div id="status">正在读取服务状态…</div><div id="messages" aria-live="polite"></div><form><textarea placeholder="输入消息，或发送 /帮助" rows="3" maxlength="2000" required aria-label="消息"></textarea><button type="submit">发送消息</button><button type="button" id="clear">清空会话</button></form></main>
<script>
let session=localStorage.getItem('qqai-session');if(!session){session=crypto.randomUUID();localStorage.setItem('qqai-session',session)}
const box=document.querySelector('#messages'),form=document.querySelector('form'),input=document.querySelector('textarea'),buttons=document.querySelectorAll('button');
function add(text,user=false){const el=document.createElement('div');el.className='message'+(user?' user':'');el.textContent=text;box.append(el);el.scrollIntoView({block:'nearest'})}
async function send(content){buttons.forEach(b=>b.disabled=true);input.disabled=true;add(content,true);try{const res=await fetch('/api/demo/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:session,content})});const data=await res.json();if(!res.ok)throw Error(typeof data.detail==='string'?data.detail:'消息未发送，请检查长度或服务状态');if(content==='/清空')box.replaceChildren();add(data.reply)}catch(e){add(e.message)}finally{buttons.forEach(b=>b.disabled=false);input.disabled=false;input.focus()}}
form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(text){input.value='';send(text)}});document.querySelector('#clear').onclick=()=>send('/清空');
fetch('/health').then(r=>r.json()).then(d=>document.querySelector('#status').textContent=`模型：${d.ai_mode==='mock'?'本地模拟':'已配置 API'} · QQ：${d.qq_configured?'已填写配置，待平台联调':'尚未填写配置'}`).catch(()=>document.querySelector('#status').textContent='服务连接失败');add('你好！可以直接发消息，或输入 /帮助 查看命令。');
</script></body></html>
